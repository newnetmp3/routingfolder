<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>RoutingFolder.com — Under Construction</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;display:grid;place-items:center;overflow:hidden;color:#eef6ff;background:#07111f}
    body:before{content:"";position:fixed;inset:-25%;background:radial-gradient(circle at 25% 30%,rgba(29,125,255,.23),transparent 30%),radial-gradient(circle at 78% 68%,rgba(45,212,191,.13),transparent 26%);filter:blur(10px)}
    main{position:relative;width:min(760px,calc(100% - 40px));padding:64px 36px;text-align:center;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(9,22,39,.76);box-shadow:0 24px 80px rgba(0,0,0,.35);backdrop-filter:blur(16px)}
    .mark{width:66px;height:66px;margin:0 auto 28px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(135deg,#1d7dff,#2dd4bf);font-size:32px;box-shadow:0 12px 35px rgba(29,125,255,.28)}
    .eyebrow{margin:0 0 12px;color:#7dd3fc;font-size:.78rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(2.4rem,8vw,5.2rem);line-height:.96;letter-spacing:-.055em}
    p{max-width:560px;margin:24px auto 0;color:#a9bad0;font-size:clamp(1rem,2.5vw,1.18rem);line-height:1.7}
    .status{display:inline-flex;align-items:center;gap:9px;margin-top:34px;padding:10px 15px;border:1px solid rgba(255,255,255,.11);border-radius:999px;color:#c9d7e8;font-size:.88rem;background:rgba(255,255,255,.04)}
    .dot{width:8px;height:8px;border-radius:50%;background:#2dd4bf;box-shadow:0 0 16px #2dd4bf}
    footer{margin-top:44px;color:#60738c;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
  </style>
</head>
<body>
  <main>
    <div class="mark">↗</div>
    <div class="eyebrow">RoutingFolder.com</div>
    <h1>Under<br>Construction</h1>
    <p>We're building something new. Check back soon.</p>
    <div class="status"><span class="dot"></span> Work in progress</div>
    <footer>RoutingFolder.com</footer>
  </main>
</body>
</html>
