name = "routingfolder"
main = "src/worker.js"
compatibility_date = "2026-10-06"

routes = [
  { pattern = "routingfolder.com", custom_domain = true },
  { pattern = "www.routingfolder.com", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
